<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ajude Roberto o Eletricista</title><link rel="stylesheet" href="style.css"></head>
<body><div id="game">
<canvas id="cv" width="800" height="700"></canvas>
<button id="mute" class="big sm" aria-label="Som">🔊</button>
<div id="start" class="scr"><h1>Ajude Roberto<br>o Eletricista</h1>
<button id="play" class="allen"><span>JOGAR</span></button><p id="prog"></p></div>
<div id="dlg" class="scr hid"><b id="who"></b><p id="txt"></p><button id="next" class="big">Avançar ▶</button></div>
<div id="hud" class="scr hid"><button id="bman" class="big">📒 Manual</button><button id="brst" class="big">↺ Reiniciar</button></div>
<div id="man" class="scr hid"><div class="book"><h2>📒 Manual do Eletricista</h2><div id="mtxt"></div>
<button id="mclose" class="big">Fechar ✕</button></div></div>
<div id="end" class="scr hid"><h2>Excelente trabalho! Mais uma casa iluminada com segurança!</h2>
<button id="again" class="big">↺ Jogar de novo</button> <button id="home" class="big">Continuar ▶</button></div>
</div><script src="game.js"></script></body></html>
